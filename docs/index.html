<script>
  // Pick the theme before anything draws, so there is no flash of the wrong colours.
  (function () { try { var p = localStorage.getItem("dueboard:theme") || "system"; var dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", p === "system" ? (dark ? "dark" : "light") : p); } catch (e) {} })();
</script>
</head>

<noscript><p style="padding:24px">Due Board needs JavaScript to run.</p></noscript>
